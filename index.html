<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Caderno</title>

<!-- Firebase SDK — mesmo projeto do SpendWise -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue, set }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDB21rD8B3f_b2rLcIiulAqgrZIYdyPLvI",
    authDomain: "controle-de-custos-39c67.firebaseapp.com",
    databaseURL: "https://controle-de-custos-39c67-default-rtdb.firebaseio.com",
    projectId: "controle-de-custos-39c67",
    storageBucket: "controle-de-custos-39c67.firebasestorage.app",
    messagingSenderId: "320742412317",
    appId: "1:320742412317:web:acc6d8fdcfe5597e3c36f4"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getDatabase(app);

  window._caderno_db  = db;
  window._caderno_ref = ref;
  window._caderno_set = set;
  window._caderno_on  = onValue;
  window.dispatchEvent(new Event("caderno_fb_ready"));
</script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0ede8;--surf:#fff;--surf2:#fafaf7;--brd:#e0ddd6;
  --acc:#3d6b4f;--accl:#eaf3ee;--acch:#2f5340;
  --txt:#2c2c2c;--mut:#90908a;--red:#c0392b;--ylw:#d4820a;
  --r:10px;--sh:0 2px 14px rgba(0,0,0,.08);--sw:230px;
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
.app{display:flex;flex-direction:column;height:100vh;max-width:1100px;margin:0 auto;padding:16px;gap:10px}

/* ── HEADER ── */
.aph{display:flex;align-items:center;gap:12px;flex-shrink:0;flex-wrap:wrap}
.logo{width:38px;height:38px;background:var(--acc);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.aph h1{font-size:1.2rem;font-weight:700}
.aph p{font-size:.73rem;color:var(--mut)}
.sync-badge{margin-left:auto;display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;font-size:.74rem;font-weight:700;border:none;cursor:default}
.sync-badge.ok  {background:#eaf3ee;color:var(--acc)}
.sync-badge.wait{background:#fff5e0;color:#a06000}
.sync-badge.err {background:#fdecea;color:var(--red)}
.sync-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sync-badge.ok   .sync-dot{background:var(--acc)}
.sync-badge.wait .sync-dot{background:#f0a000;animation:pulse 1s infinite}
.sync-badge.err  .sync-dot{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ── TABS ── */
.tnav{display:flex;gap:4px;background:var(--brd);border-radius:var(--r) var(--r) 0 0;padding:4px 4px 0;flex-shrink:0}
.tbtn{flex:1;padding:10px 12px;border:none;background:transparent;border-radius:8px 8px 0 0;font-size:.87rem;font-weight:600;color:var(--mut);cursor:pointer;transition:all .18s;display:flex;align-items:center;justify-content:center;gap:6px}
.tbtn:hover{background:rgba(255,255,255,.6);color:var(--txt)}
.tbtn.active{background:var(--surf);color:var(--acc)}
.tpanels{flex:1;background:var(--surf);border-radius:0 0 var(--r) var(--r);border:1px solid var(--brd);border-top:none;box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column;min-height:0}
.tp{display:none;flex:1;min-height:0;overflow:hidden}
.tp.active{display:flex;flex-direction:column}

/* ── NOTAS ── */
.nl{display:flex;flex:1;min-height:0;overflow:hidden}
.sidebar{width:var(--sw);min-width:var(--sw);border-right:1.5px solid var(--brd);display:flex;flex-direction:column;background:var(--surf2)}
.sbh{padding:13px 12px 10px;border-bottom:1px solid var(--brd);flex-shrink:0}
.sbh h3{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin-bottom:9px}
.nff{display:flex;gap:5px}
.nff input{flex:1;min-width:0;padding:7px 8px;border:1.5px solid var(--brd);border-radius:7px;font-size:.82rem;background:#fff;color:var(--txt);outline:none}
.nff input:focus{border-color:var(--acc)}
.nff button{flex-shrink:0;width:32px;height:33px;background:var(--acc);color:#fff;border:none;border-radius:7px;cursor:pointer;font-size:.95rem;font-weight:700;display:flex;align-items:center;justify-content:center}
.nff button:hover{background:var(--acch)}
.flist{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px}
.fi{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:.87rem;font-weight:500;transition:background .14s}
.fi:hover{background:#ede9e3}
.fi.active{background:var(--accl);color:var(--acc);font-weight:700}
.fi .fname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fi .fcnt{font-size:.68rem;background:var(--brd);border-radius:10px;padding:1px 6px;color:var(--mut);flex-shrink:0}
.fi.active .fcnt{background:#c8e6d4;color:var(--acc)}
.fdel{display:none;background:none;border:none;cursor:pointer;color:var(--mut);font-size:11px;padding:2px 4px;border-radius:4px;flex-shrink:0}
.fdel:hover{color:var(--red);background:#fdecea}
.fi:hover .fdel{display:inline-flex}

/* ── DRAG & DROP (opera no .f-group) ── */
.drag-handle{flex-shrink:0;cursor:grab;color:#c0bdb7;font-size:13px;line-height:1;padding:0 4px 0 0;user-select:none;touch-action:none}
.drag-handle:active{cursor:grabbing}
.f-group.dnd-src > .fi{opacity:.3;background:#ede9e3}
.f-group.dnd-src .sf-section{opacity:.3}
.f-group.dnd-above{border-top:2.5px solid var(--acc)}
.f-group.dnd-below{border-bottom:2.5px solid var(--acc)}
/* ghost flutuante no touch */
.dnd-ghost-el{position:fixed;pointer-events:none;z-index:9999;opacity:.88;
  background:var(--surf);border:1.5px solid var(--acc);border-radius:8px;
  padding:9px 10px;font-size:.87rem;font-weight:700;color:var(--acc);
  box-shadow:0 6px 24px rgba(0,0,0,.18);white-space:nowrap;
  display:flex;align-items:center;gap:8px;transform:scale(1.04)}

/* ── SUBPASTAS (desktop) ── */
.sf-section{}
.fi.sf-fi{padding-left:20px;font-size:.84rem;color:var(--txt)}
.fi.sf-fi.active{background:var(--accl);color:var(--acc);font-weight:700}
.sf-arrow{flex-shrink:0;color:var(--mut);font-size:.7rem;margin-right:2px}
.sf-add-row{display:flex;gap:4px;padding:3px 8px 7px 28px}
.sf-add-row input{flex:1;min-width:0;padding:5px 8px;border:1.5px dashed var(--brd);border-radius:7px;font-size:.78rem;background:#fff;color:var(--txt);outline:none}
.sf-add-row input:focus{border-color:var(--acc);border-style:solid}
.sf-add-row button{flex-shrink:0;width:26px;height:26px;background:var(--accl);color:var(--acc);border:1.5px solid #c8e6d4;border-radius:6px;cursor:pointer;font-size:.88rem;display:flex;align-items:center;justify-content:center}
.sf-add-row button:hover{background:var(--acc);color:#fff}

/* ── TIRA DE SUBPASTAS (mobile) ── */
.sf-strip{display:none}

/* ── PAINEL DE NOTAS ── */
.npanel{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.nph{padding:12px 18px;border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex-shrink:0;background:#fff;min-height:56px}
.nph h2{font-size:.93rem;font-weight:700;flex:1;min-width:80px}
.ha{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.nbody{flex:1;overflow-y:auto;padding:16px 20px}
.ne{border:1.5px solid var(--brd);border-radius:var(--r);margin-bottom:13px;background:var(--surf2);overflow:hidden}
.ne:hover{box-shadow:0 3px 14px rgba(0,0,0,.08)}
.neh{display:flex;align-items:center;gap:9px;padding:10px 13px;background:var(--accl);border-bottom:1.5px solid var(--brd);cursor:pointer;user-select:none}
.neh .dlbl{font-weight:700;font-size:.84rem;color:var(--acc);flex:1}
.neh .prev{font-size:.76rem;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:240px}
.neh .chev{font-size:.7rem;color:var(--mut);transition:transform .2s}
.ne.col .chev{transform:rotate(-90deg)}
.ne.col .nebody{display:none}
.nebody{padding:13px}
textarea.nta{width:100%;min-height:115px;border:1.5px solid var(--brd);border-radius:8px;padding:11px;font-size:.9rem;font-family:inherit;line-height:1.65;background:#fff;color:var(--txt);resize:vertical;outline:none;transition:border .15s}
textarea.nta:focus{border-color:var(--acc)}
.nef{margin-top:8px}
.asl{font-size:.73rem;color:var(--mut)}

/* ── AÇÕES ── */
.ati{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:20px 24px;gap:14px}
.atb{display:flex;gap:11px;align-items:flex-end;flex-wrap:wrap;flex-shrink:0}
.fg{display:flex;flex-direction:column;gap:4px}
.fg label{font-size:.74rem;color:var(--mut);font-weight:600}
.fg input{padding:8px 12px;border:1.5px solid var(--brd);border-radius:8px;font-size:.85rem;background:var(--surf2);color:var(--txt);outline:none;transition:border .15s}
.fg input:focus{border-color:var(--acc)}
.fg input[type="text"]{min-width:250px}
.sbar{display:flex;gap:16px;padding:9px 13px;background:var(--accl);border-radius:8px;border:1px solid #c8e6d4;flex-shrink:0;flex-wrap:wrap}
.st{font-size:.79rem;color:var(--acc);font-weight:600}
.st span{color:var(--mut);font-weight:400}
.ascr{flex:1;overflow-y:auto}
.alist{display:flex;flex-direction:column;gap:9px}
.ai{display:flex;align-items:flex-start;gap:12px;padding:13px 14px;border:1.5px solid var(--brd);border-radius:var(--r);background:var(--surf2)}
.ai:hover{box-shadow:0 2px 10px rgba(0,0,0,.07)}
.ai.done{background:#f8f8f6;border-color:#d8d8d2;opacity:.72}
.ack{flex-shrink:0;width:22px;height:22px;border:2px solid var(--brd);border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;background:#fff;color:transparent;transition:all .15s;margin-top:1px}
.ai.done .ack{background:var(--acc);border-color:var(--acc);color:#fff}
.ack:hover{border-color:var(--acc)}
.acon{flex:1;min-width:0}
.atxt{font-size:.9rem;font-weight:500;line-height:1.5;word-break:break-word;cursor:text}
.atxt:hover{color:var(--acc)}
.ai.done .atxt{text-decoration:line-through;color:var(--mut);cursor:default}
.ai.done .atxt:hover{color:var(--mut)}
.ameta{display:flex;gap:11px;margin-top:5px;flex-wrap:wrap}
.mb{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;color:var(--mut);font-weight:500}
.mb.due{color:var(--ylw)}
.mb.ov{color:var(--red);font-weight:700}
.mb.dn{color:var(--acc)}
.adel{flex-shrink:0;background:none;border:none;cursor:pointer;color:#ccc;font-size:14px;padding:2px 4px;border-radius:5px}
.adel:hover{color:var(--red);background:#fdecea}
.sdiv{text-align:center;font-size:.74rem;color:var(--mut);margin:13px 0 9px;display:flex;align-items:center;gap:9px}
.sdiv::before,.sdiv::after{content:'';flex:1;height:1px;background:var(--brd)}
.aedit-wrap{display:flex;gap:7px;align-items:center;width:100%;margin-bottom:4px}
.aedit-in{flex:1;padding:6px 9px;border:1.5px solid var(--acc);border-radius:7px;font-size:.9rem;font-family:inherit;outline:none;background:#fff;color:var(--txt)}
.aedit-ok{padding:5px 10px;background:var(--acc);color:#fff;border:none;border-radius:7px;font-size:.8rem;font-weight:700;cursor:pointer}
.aedit-ok:hover{background:var(--acch)}
.aedit-cn{padding:5px 8px;background:none;color:var(--mut);border:1.5px solid var(--brd);border-radius:7px;font-size:.8rem;cursor:pointer}
.aedit-cn:hover{background:#ede9e3}

/* ── BOTÕES ── */
.btn{padding:8px 16px;border:none;border-radius:8px;font-size:.83rem;font-weight:600;cursor:pointer;transition:background .15s,transform .1s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:active{transform:scale(.97)}
.bp{background:var(--acc);color:#fff}
.bp:hover{background:var(--acch)}
.bo{background:transparent;color:var(--acc);border:1.5px solid var(--acc)}
.bo:hover{background:var(--accl)}
.bd{background:#fdecea;color:var(--red);border:1.5px solid #f5c6c0}
.bd:hover{background:#f9d4d0}
.bsm{padding:5px 10px;font-size:.77rem}
.fin{padding:7px 12px;border:1.5px solid var(--brd);border-radius:8px;font-size:.82rem;background:var(--surf2);color:var(--txt);outline:none}
.fin:focus{border-color:var(--acc)}

/* ── EMPTY / MODAL ── */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;text-align:center;color:var(--mut);height:100%}
.empty .ei{font-size:2.6rem;margin-bottom:13px}
.empty p{font-size:.88rem;line-height:1.6}
.mov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:999;align-items:center;justify-content:center;padding:16px}
.mov.open{display:flex}
.modal{background:#fff;border-radius:14px;padding:24px;width:100%;max-width:400px;box-shadow:0 8px 40px rgba(0,0,0,.2)}
.modal h3{font-size:1rem;font-weight:700;margin-bottom:13px}
.modal input{width:100%;padding:9px 12px;border:1.5px solid var(--brd);border-radius:8px;font-size:.9rem;outline:none;margin-bottom:13px}
.modal input:focus{border-color:var(--acc)}
.mact{display:flex;justify-content:flex-end;gap:8px}

/* Tela de carregamento */
#loader{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:9999}
.loader-logo{font-size:48px}
.loader-txt{font-size:14px;color:var(--mut);font-weight:600}
.spinner{width:30px;height:30px;border:3px solid var(--brd);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── MOBILE ── */
@media(max-width:640px){
  .app{padding:10px;gap:8px}
  .fg input[type="text"]{min-width:100%}
  .atb{flex-direction:column;align-items:stretch}
  .ati{padding:14px 14px}

  .nl{flex-direction:column}

  .sidebar{
    width:100%;min-width:100%;
    border-right:none;
    border-bottom:1.5px solid var(--brd);
    flex-direction:row;
    align-items:center;
    flex-shrink:0;
    overflow:hidden;
    background:var(--surf2);
  }
  .sbh{
    padding:8px 10px;
    border-bottom:none;
    border-right:1px solid var(--brd);
    flex-shrink:0;
    display:flex;align-items:center;
  }
  .sbh h3{display:none;margin:0}
  .nff{flex-direction:row;gap:4px;align-items:center}
  .nff input{width:110px;padding:5px 7px;font-size:.78rem}
  .nff button{width:28px;height:28px;font-size:.85rem}

  .flist{
    display:flex;flex-direction:row;flex-wrap:nowrap;
    overflow-x:auto;overflow-y:hidden;
    padding:6px 8px;gap:5px;
    flex:1;
    scrollbar-width:none;
  }
  .flist::-webkit-scrollbar{display:none}

  /* No mobile o f-group vira inline-flex horizontal */
  .f-group{display:contents}
  .fi{
    flex-shrink:0;
    padding:5px 12px;
    border-radius:20px;
    border:1.5px solid var(--brd);
    background:var(--surf);
    gap:5px;
    white-space:nowrap;
  }
  .fi.active{border-color:var(--acc)}
  .fi .fcnt{display:none}
  .fi:hover .fdel{display:none}
  /* Esconde subpastas inline no mobile */
  .sf-section{display:none}

  /* Tira de subpastas mobile — abaixo do flist */
  .sf-strip{
    display:flex;
    flex-direction:row;
    flex-wrap:nowrap;
    overflow-x:auto;
    overflow-y:hidden;
    padding:4px 8px 5px;
    gap:5px;
    border-top:1px solid var(--brd);
    background:#f5f2ed;
    scrollbar-width:none;
    width:100%;
    flex-shrink:0;
  }
  .sf-strip::-webkit-scrollbar{display:none}
  .sf-chip{
    flex-shrink:0;
    padding:4px 10px;
    border-radius:14px;
    border:1.5px solid var(--brd);
    background:var(--surf);
    font-size:.75rem;
    cursor:pointer;
    white-space:nowrap;
    color:var(--txt);
  }
  .sf-chip.active{border-color:var(--acc);background:var(--accl);color:var(--acc);font-weight:700}
  .sf-chip:hover{background:#ede9e3}
  .sf-mob-in{
    flex-shrink:0;
    width:115px;
    padding:4px 8px;
    border:1.5px dashed var(--brd);
    border-radius:14px;
    font-size:.74rem;
    background:#fff;
    color:var(--txt);
    outline:none;
  }
  .sf-mob-in:focus{border-color:var(--acc);border-style:solid}
  .sf-mob-btn{
    flex-shrink:0;
    width:24px;height:24px;
    background:var(--accl);
    color:var(--acc);
    border:1.5px solid #c8e6d4;
    border-radius:50%;
    cursor:pointer;
    font-size:.85rem;
    display:flex;align-items:center;justify-content:center;
  }
  .sf-mob-btn:hover{background:var(--acc);color:#fff}

  .npanel{flex:1;min-height:0}
  .nph{padding:10px 14px;flex-wrap:wrap;gap:7px}
  .nph h2{font-size:.88rem}
  .nbody{padding:10px 14px}
}
</style>
</head>
<body>

<!-- Tela de carregamento -->
<div id="loader">
  <div class="loader-logo">📒</div>
  <div class="loader-txt">Conectando...</div>
  <div class="spinner"></div>
</div>

<div class="app">
  <div class="aph">
    <div class="logo">📒</div>
    <div>
      <h1>Meu Caderno</h1>
      <p>Anotações por pasta · Ações do dia a dia</p>
    </div>
    <span class="sync-badge wait" id="sync-badge">
      <span class="sync-dot"></span>
      <span id="sync-label">Conectando…</span>
    </span>
  </div>

  <div class="tnav">
    <button class="tbtn active" onclick="switchTab('notes')">📁 Anotações por Pasta</button>
    <button class="tbtn" onclick="switchTab('actions')">✅ Ações do Dia a Dia</button>
  </div>

  <div class="tpanels">
    <!-- NOTAS -->
    <div id="tab-notes" class="tp active">
      <div class="nl">
        <div class="sidebar" id="sidebar-el">
          <div class="sbh">
            <h3>Pastas</h3>
            <div class="nff">
              <input type="text" id="nfi" placeholder="Nova pasta…" maxlength="40"
                onkeydown="if(event.key==='Enter')createFolder()"/>
              <button onclick="createFolder()">＋</button>
            </div>
          </div>
          <!-- lista de pastas (desktop: vertical; mobile: horizontal chips) -->
          <div class="flist" id="flist"></div>
          <!-- tira de subpastas — só visível no mobile -->
          <div class="sf-strip" id="sf-strip"></div>
        </div>
        <div class="npanel">
          <div class="nph" id="nph">
            <div style="display:flex;align-items:center;gap:10px;color:var(--mut)">
              <span style="font-size:1.3rem">👈</span>
              <p style="font-size:.87rem">Selecione ou crie uma pasta</p>
            </div>
          </div>
          <div class="nbody" id="nbody"></div>
        </div>
      </div>
    </div>

    <!-- AÇÕES -->
    <div id="tab-actions" class="tp">
      <div class="ati">
        <div class="atb">
          <div class="fg">
            <label>Descrição da ação</label>
            <input type="text" id="act-txt" placeholder="Descreva a ação…"
              onkeydown="if(event.key==='Enter')addAction()"/>
          </div>
          <div class="fg">
            <label>Vencimento</label>
            <input type="date" id="act-due"/>
          </div>
          <button class="btn bp" onclick="addAction()" style="align-self:flex-end">＋ Adicionar</button>
        </div>
        <div class="sbar" id="sbar" style="display:none"></div>
        <div class="ascr">
          <div id="ap"></div>
          <div id="ads" style="display:none">
            <div class="sdiv">Concluídas</div>
            <div id="ad"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal renomear pasta / subpasta -->
<div class="mov" id="ren-mov">
  <div class="modal">
    <h3 id="ren-title">✏️ Renomear pasta</h3>
    <input type="text" id="ren-in" maxlength="40"
      onkeydown="if(event.key==='Enter')doRename()"/>
    <div class="mact">
      <button class="btn bo" onclick="closeRen()">Cancelar</button>
      <button class="btn bp" onclick="doRename()">Salvar</button>
    </div>
  </div>
</div>

<script>
/* ── STATE ── */
let folders     = [];
let actionsData = [];
let activeFId   = null;
let activeSFId  = null;   // id da subpasta ativa (null = nível de pasta)
let colState    = {};
let renFId      = null;
let renSFId     = null;   // se preenchido, estamos renomeando subpasta
let editAId     = null;
let _writing    = false;
let saveTimer   = null;

let nxtF = 1, nxtA = 1, nxtN = 1, nxtSF = 1;

function recomputeCounters(){
  nxtF  = folders.length ? Math.max(...folders.map(f=>f.id))+1 : 1;
  nxtA  = actionsData.length ? Math.max(...actionsData.map(a=>a.id))+1 : 1;
  nxtN  = 1; nxtSF = 1;
  folders.forEach(f=>{
    (f.notes||[]).forEach(n=>{ if(n.id>=nxtN) nxtN=n.id+1; });
    (f.subfolders||[]).forEach(sf=>{
      if(sf.id>=nxtSF) nxtSF=sf.id+1;
      (sf.notes||[]).forEach(n=>{ if(n.id>=nxtN) nxtN=n.id+1; });
    });
  });
}

/* ── UTILS ── */
function today(){ return new Date().toISOString().slice(0,10); }
function fmtD(iso){ if(!iso)return''; const[y,m,d]=iso.split('-'); return`${d}/${m}/${y}`; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#x27;'); }

/* Retorna o target (pasta ou subpasta) e as notas da seleção atual */
function getActiveTarget(){
  const folder = folders.find(f=>f.id===activeFId);
  if(!folder) return null;
  if(activeSFId){
    const sf = (folder.subfolders||[]).find(sf=>sf.id===activeSFId);
    return sf ? {folder, sf, notes:sf.notes||(sf.notes=[])} : null;
  }
  return {folder, sf:null, notes:folder.notes||(folder.notes=[])};
}

/* ── SYNC STATUS ── */
function setSS(type, label){
  const b=document.getElementById('sync-badge'), l=document.getElementById('sync-label');
  b.className='sync-badge '+type; l.textContent=label;
}

/* ── FIREBASE: escrever ── */
function fbSave(){
  if(!window._caderno_set) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    _writing = true;
    setSS('wait','Salvando…');
    const dbRef = window._caderno_ref(window._caderno_db, 'meuCaderno');
    window._caderno_set(dbRef, { folders, actions: actionsData })
      .then(()=>{ setSS('ok','Sincronizado'); setTimeout(()=>{ _writing=false; }, 300); })
      .catch(()=>{ setSS('err','Erro ao salvar'); _writing=false; });
  }, 600);
}

/* ── FIREBASE: ouvir ── */
function fbListen(){
  const dbRef = window._caderno_ref(window._caderno_db, 'meuCaderno');
  window._caderno_on(dbRef, snap => {
    if(_writing) return;
    const data = snap.val();
    if(data){
      folders     = data.folders     || [];
      actionsData = data.actions     || [];
    } else { fbSave(); return; }
    recomputeCounters();
    // Valida pasta ativa
    if(activeFId && !folders.find(f=>f.id===activeFId)){
      activeFId = folders.length ? folders[0].id : null;
      activeSFId = null;
    }
    if(!activeFId && folders.length) activeFId = folders[0].id;
    // Valida subpasta ativa
    if(activeSFId && activeFId){
      const f = folders.find(f=>f.id===activeFId);
      if(!f || !(f.subfolders||[]).find(sf=>sf.id===activeSFId)) activeSFId=null;
    }
    renderFolders(); renderNotes(); renderActions();
    setSS('ok','Sincronizado');
  }, ()=>{ setSS('err','Sem conexão'); });
}

/* ── INICIALIZAR FIREBASE ── */
window.addEventListener('caderno_fb_ready', ()=>{
  document.getElementById('loader').style.display = 'none';
  fbListen();
});
setTimeout(()=>{
  const l = document.getElementById('loader');
  if(l.style.display !== 'none'){
    l.innerHTML = '<div style="text-align:center;padding:24px;color:#555">Erro ao conectar.<br>Verifique sua internet.</div>';
  }
}, 7000);

/* ── TABS ── */
function switchTab(t){
  document.querySelectorAll('.tbtn').forEach((b,i)=>b.classList.toggle('active',i===(t==='notes'?0:1)));
  document.getElementById('tab-notes').classList.toggle('active',t==='notes');
  document.getElementById('tab-actions').classList.toggle('active',t==='actions');
}

/* ── DRAG & DROP STATE ── */
let _dndSrc  = null;
let _touchDnd = null;
let _touchTimer = null;

function _dndReorder(srcIdx, tgtIdx){
  if(srcIdx === tgtIdx) return;
  const item = folders.splice(srcIdx, 1)[0];
  const newIdx = srcIdx < tgtIdx ? tgtIdx - 1 : tgtIdx;
  folders.splice(newIdx, 0, item);
  renderFolders(); fbSave();
}

/* ── Desktop HTML5 DnD ── */
function dndStart(e, idx){
  _dndSrc = idx;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', idx);
  setTimeout(()=>{ const el=document.querySelectorAll('#flist .f-group')[idx]; if(el)el.classList.add('dnd-src'); }, 0);
}
function dndEnter(e, idx){
  e.preventDefault();
  document.querySelectorAll('#flist .f-group').forEach(el=>{ el.classList.remove('dnd-above','dnd-below'); });
  if(_dndSrc===null||_dndSrc===idx) return;
  const el=document.querySelectorAll('#flist .f-group')[idx];
  if(!el) return;
  const mid = el.getBoundingClientRect().top + el.getBoundingClientRect().height/2;
  el.classList.add(e.clientY < mid ? 'dnd-above' : 'dnd-below');
}
function dndDrop(e, idx){
  e.preventDefault();
  document.querySelectorAll('#flist .f-group').forEach(el=>el.classList.remove('dnd-src','dnd-above','dnd-below'));
  if(_dndSrc===null) return;
  const src=_dndSrc; _dndSrc=null;
  _dndReorder(src, idx);
}
function dndEnd(){
  _dndSrc=null;
  document.querySelectorAll('#flist .f-group').forEach(el=>el.classList.remove('dnd-src','dnd-above','dnd-below'));
}

/* ── Mobile Touch DnD ── */
function _touchStart(e, idx){
  if(e.touches.length>1) return;
  _touchTimer = setTimeout(()=>{
    _touchTimer=null;
    const t=e.touches[0];
    const ghost=document.createElement('div');
    ghost.className='dnd-ghost-el';
    ghost.innerHTML='⠿ '+esc(folders[idx].name);
    ghost.style.left=(t.clientX+12)+'px';
    ghost.style.top=(t.clientY-18)+'px';
    document.body.appendChild(ghost);
    const grp=document.querySelectorAll('#flist .f-group')[idx];
    if(grp) grp.classList.add('dnd-src');
    _touchDnd={srcIdx:idx, ghostEl:ghost};
    navigator.vibrate&&navigator.vibrate(40);
  }, 450);
}
function _touchMove(e){
  clearTimeout(_touchTimer); _touchTimer=null;
  if(!_touchDnd) return;
  e.preventDefault();
  const t=e.touches[0];
  _touchDnd.ghostEl.style.left=(t.clientX+12)+'px';
  _touchDnd.ghostEl.style.top=(t.clientY-18)+'px';
  _touchDnd.ghostEl.style.display='none';
  const under=document.elementFromPoint(t.clientX, t.clientY);
  _touchDnd.ghostEl.style.display='';
  const tgtGrp=under?.closest('#flist .f-group');
  document.querySelectorAll('#flist .f-group').forEach(el=>el.classList.remove('dnd-above','dnd-below'));
  if(tgtGrp){
    const items=[...document.querySelectorAll('#flist .f-group')];
    const tgtIdx=items.indexOf(tgtGrp);
    if(tgtIdx!==-1&&tgtIdx!==_touchDnd.srcIdx){
      const mid=tgtGrp.getBoundingClientRect().top+tgtGrp.getBoundingClientRect().height/2;
      tgtGrp.classList.add(t.clientY<mid?'dnd-above':'dnd-below');
      _touchDnd.tgtIdx=tgtIdx;
    }
  }
}
function _touchEnd(e){
  clearTimeout(_touchTimer); _touchTimer=null;
  if(!_touchDnd) return;
  const {srcIdx, ghostEl, tgtIdx}=_touchDnd;
  ghostEl.remove();
  document.querySelectorAll('#flist .f-group').forEach(el=>el.classList.remove('dnd-src','dnd-above','dnd-below'));
  _touchDnd=null;
  if(tgtIdx!==undefined&&tgtIdx!==srcIdx) _dndReorder(srcIdx, tgtIdx);
}

/* ── PASTAS ── */
function renderFolders(){
  const el=document.getElementById('flist');
  if(!folders.length){
    el.innerHTML=`<div style="padding:18px 10px;text-align:center;color:var(--mut);font-size:.8rem;line-height:1.7">Crie uma pasta.<br>Ex: nome de um<br>colega ou assunto.</div>`;
    renderSFStrip(); return;
  }

  el.innerHTML = folders.map((f,i)=>{
    const isActive = f.id===activeFId;
    const sfs = f.subfolders||[];
    const totalNotes = (f.notes||[]).length + sfs.reduce((s,sf)=>s+(sf.notes||[]).length,0);

    // Subpastas inline (visível apenas no desktop)
    const sfHtml = isActive ? `
      <div class="sf-section">
        ${sfs.map(sf=>`
          <div class="fi sf-fi ${activeSFId===sf.id?'active':''}"
            onclick="selSF(${f.id},${sf.id})">
            <span class="sf-arrow">↳</span>
            <span class="fname">${esc(sf.name)}</span>
            <span class="fcnt">${(sf.notes||[]).length}</span>
            <button class="fdel" onclick="event.stopPropagation();openRenSF(${f.id},${sf.id})" title="Renomear">✏️</button>
            <button class="fdel" onclick="event.stopPropagation();delSF(${f.id},${sf.id})" title="Excluir">✕</button>
          </div>`).join('')}
        <div class="sf-add-row">
          <input id="sfi-${f.id}" type="text" placeholder="Nova subpasta…" maxlength="40"
            onclick="event.stopPropagation()"
            onkeydown="if(event.key==='Enter')createSubfolder(${f.id})"/>
          <button onclick="createSubfolder(${f.id})">＋</button>
        </div>
      </div>` : '';

    return `<div class="f-group"
      ondragenter="dndEnter(event,${i})"
      ondragover="event.preventDefault()"
      ondrop="dndDrop(event,${i})"
      ondragend="dndEnd()">
      <div class="fi ${isActive&&!activeSFId?'active':''}"
        draggable="true"
        ondragstart="dndStart(event,${i})"
        onclick="selF(${f.id})">
        <span class="drag-handle" onclick="event.stopPropagation()">⠿</span>
        <span class="fname">${esc(f.name)}</span>
        <span class="fcnt">${totalNotes}</span>
        <button class="fdel" onclick="event.stopPropagation();openRen(${f.id})" title="Renomear">✏️</button>
        <button class="fdel" onclick="event.stopPropagation();delF(${f.id})" title="Excluir">✕</button>
      </div>
      ${sfHtml}
    </div>`;
  }).join('');

  // Touch DnD — listener no .fi principal de cada grupo
  document.querySelectorAll('#flist .f-group').forEach((grp,i)=>{
    const mainFi = grp.querySelector('.fi:not(.sf-fi)');
    if(!mainFi) return;
    mainFi.addEventListener('touchstart', e=>_touchStart(e,i), {passive:true});
    mainFi.addEventListener('touchmove',  e=>_touchMove(e),   {passive:false});
    mainFi.addEventListener('touchend',   e=>_touchEnd(e),    {passive:true});
    mainFi.addEventListener('touchcancel',()=>{
      clearTimeout(_touchTimer);
      if(_touchDnd){_touchDnd.ghostEl.remove();_touchDnd=null;}
      document.querySelectorAll('#flist .f-group').forEach(x=>x.classList.remove('dnd-src','dnd-above','dnd-below'));
    },{passive:true});
  });

  renderSFStrip();
}

/* ── TIRA DE SUBPASTAS (mobile) ── */
function renderSFStrip(){
  const strip = document.getElementById('sf-strip');
  if(!activeFId){ strip.innerHTML=''; return; }
  const folder = folders.find(f=>f.id===activeFId);
  if(!folder){ strip.innerHTML=''; return; }
  const sfs = folder.subfolders||[];
  const chips = sfs.map(sf=>
    `<span class="sf-chip ${activeSFId===sf.id?'active':''}" onclick="selSF(${folder.id},${sf.id})">↳ ${esc(sf.name)}</span>`
  ).join('');
  strip.innerHTML = chips +
    `<input id="sfi-mob-${folder.id}" class="sf-mob-in" type="text" placeholder="+ subpasta…" maxlength="40"
       onkeydown="if(event.key==='Enter')createSubfolderMob(${folder.id})"/>` +
    `<button class="sf-mob-btn" onclick="createSubfolderMob(${folder.id})">＋</button>`;
}

/* ── SUBFOLDER CRUD ── */
function selF(id){
  activeFId=id; activeSFId=null;
  renderFolders(); renderNotes();
}
function selSF(fId, sfId){
  activeFId=fId; activeSFId=sfId;
  renderFolders(); renderNotes();
}

function _doCreateSubfolder(parentFId, name){
  const folder=folders.find(f=>f.id===parentFId); if(!folder)return;
  if(!folder.subfolders) folder.subfolders=[];
  const sf={id:nxtSF++, name, notes:[]};
  folder.subfolders.push(sf);
  activeFId=parentFId; activeSFId=sf.id;
  renderFolders(); renderNotes(); fbSave();
}
function createSubfolder(parentFId){
  const inp=document.getElementById('sfi-'+parentFId); if(!inp)return;
  const name=inp.value.trim(); if(!name){inp.focus();return;}
  inp.value=''; _doCreateSubfolder(parentFId, name);
}
function createSubfolderMob(parentFId){
  const inp=document.getElementById('sfi-mob-'+parentFId); if(!inp)return;
  const name=inp.value.trim(); if(!name){inp.focus();return;}
  inp.value=''; _doCreateSubfolder(parentFId, name);
}

function delSF(parentFId, sfId){
  const folder=folders.find(f=>f.id===parentFId); if(!folder)return;
  const sf=(folder.subfolders||[]).find(sf=>sf.id===sfId); if(!sf)return;
  if(!confirm(`Excluir a subpasta "${sf.name}" e todas as anotações?`))return;
  folder.subfolders=folder.subfolders.filter(sf=>sf.id!==sfId);
  if(activeSFId===sfId){ activeSFId=null; }
  renderFolders(); renderNotes(); fbSave();
}

function openRenSF(parentFId, sfId){
  renFId=parentFId; renSFId=sfId;
  const folder=folders.find(f=>f.id===parentFId);
  const sf=folder&&(folder.subfolders||[]).find(sf=>sf.id===sfId);
  document.getElementById('ren-title').textContent='✏️ Renomear subpasta';
  document.getElementById('ren-in').value=sf?sf.name:'';
  document.getElementById('ren-mov').classList.add('open');
  setTimeout(()=>document.getElementById('ren-in').focus(),50);
}

/* ── PASTAS CRUD ── */
function createFolder(){
  const inp=document.getElementById('nfi'), name=inp.value.trim();
  if(!name){ inp.focus(); return; }
  const f={id:nxtF++, name, notes:[], subfolders:[]};
  folders.push(f); inp.value='';
  activeFId=f.id; activeSFId=null;
  renderFolders(); renderNotes(); fbSave();
}

function delF(id){
  const f=folders.find(f=>f.id===id); if(!f)return;
  if(!confirm(`Excluir a pasta "${f.name}" e todas as anotações?`))return;
  folders=folders.filter(f=>f.id!==id);
  if(activeFId===id){ activeFId=folders.length?folders[0].id:null; activeSFId=null; }
  renderFolders(); renderNotes(); fbSave();
}

function openRen(id){
  renFId=id; renSFId=null;
  const f=folders.find(f=>f.id===id);
  document.getElementById('ren-title').textContent='✏️ Renomear pasta';
  document.getElementById('ren-in').value=f?f.name:'';
  document.getElementById('ren-mov').classList.add('open');
  setTimeout(()=>document.getElementById('ren-in').focus(),50);
}
function closeRen(){ renFId=null; renSFId=null; document.getElementById('ren-mov').classList.remove('open'); }
function doRename(){
  const name=document.getElementById('ren-in').value.trim(); if(!name)return;
  if(renSFId!==null){
    // subpasta
    const folder=folders.find(f=>f.id===renFId);
    const sf=folder&&(folder.subfolders||[]).find(sf=>sf.id===renSFId);
    if(sf) sf.name=name;
  } else {
    // pasta
    const f=folders.find(f=>f.id===renFId); if(f) f.name=name;
  }
  closeRen(); renderFolders(); renderNotes(); fbSave();
}
document.getElementById('ren-mov').addEventListener('click',e=>{if(e.target===e.currentTarget)closeRen();});

/* ── PAINEL DE NOTAS ── */
function renderNotes(){
  const hdr=document.getElementById('nph'), body=document.getElementById('nbody');
  if(!activeFId){
    hdr.innerHTML=`<div style="display:flex;align-items:center;gap:10px;color:var(--mut)"><span style="font-size:1.3rem">👈</span><p style="font-size:.87rem">Selecione ou crie uma pasta</p></div>`;
    body.innerHTML=''; return;
  }
  const folder=folders.find(f=>f.id===activeFId); if(!folder)return;
  const target = getActiveTarget(); if(!target)return;
  const {notes} = target;

  // Cabeçalho com breadcrumb
  let titleHtml = activeSFId
    ? `${esc(folder.name)} <span style="color:var(--mut);font-weight:400;font-size:.85em">›</span> ${esc(target.sf.name)}`
    : esc(folder.name);

  const pfd=document.getElementById('nfd'); const fd=pfd?pfd.value:'';
  hdr.innerHTML=`
    <h2>${titleHtml}</h2>
    <div class="ha">
      <input type="date" id="nfd" class="fin bsm" value="${esc(fd)}" oninput="renderNotes()"/>
      <button class="btn bo bsm" onclick="document.getElementById('nfd').value='';renderNotes()">Limpar</button>
      <button class="btn bp bsm" onclick="addNote()">＋ Nova anotação</button>
    </div>`;

  const fd2=document.getElementById('nfd').value;
  let sorted=[...notes].sort((a,b)=>b.date.localeCompare(a.date));
  if(fd2) sorted=sorted.filter(n=>n.date===fd2);
  if(!sorted.length){
    body.innerHTML=`<div class="empty"><div class="ei">📝</div><p>${fd2?'Nenhuma anotação nesta data.':'Esta pasta está vazia.<br>Clique em <strong>+ Nova anotação</strong>.'}</p></div>`;
    return;
  }
  body.innerHTML=sorted.map(n=>{
    const c=!!colState[n.id];
    const pv=c&&n.text?n.text.slice(0,70)+(n.text.length>70?'…':''):'';
    return`<div class="ne ${c?'col':''}" id="ne-${n.id}">
      <div class="neh" onclick="togNote(${n.id})">
        <span class="dlbl">📅 ${fmtD(n.date)}</span>
        ${c&&pv?`<span class="prev">${esc(pv)}</span>`:''}
        <span class="chev">▼</span>
        <button class="btn bd bsm" style="margin-left:5px"
          onclick="event.stopPropagation();delNote(${n.id})">🗑</button>
      </div>
      <div class="nebody">
        <textarea class="nta" placeholder="Escreva aqui…"
          oninput="noteChg(${n.id},this.value)">${esc(n.text)}</textarea>
        <div class="nef"><span class="asl">💾 Salvo automaticamente</span></div>
      </div>
    </div>`;
  }).join('');
}

function addNote(){
  const target=getActiveTarget(); if(!target)return;
  const {notes}=target;
  const d=today(), ex=notes.find(n=>n.date===d);
  if(ex){ colState[ex.id]=false; renderNotes(); focusNote(ex.id); return; }
  const n={id:nxtN++, date:d, text:''};
  notes.unshift(n); colState[n.id]=false;
  renderFolders(); renderNotes(); focusNote(n.id); fbSave();
}
function focusNote(id){
  setTimeout(()=>{
    const el=document.getElementById('ne-'+id);
    if(el){ el.scrollIntoView({behavior:'smooth',block:'center'}); const ta=el.querySelector('textarea'); if(ta)ta.focus(); }
  },80);
}
function delNote(id){
  if(!confirm('Excluir esta anotação?'))return;
  const target=getActiveTarget(); if(!target)return;
  if(target.sf) target.sf.notes=target.sf.notes.filter(n=>n.id!==id);
  else target.folder.notes=target.folder.notes.filter(n=>n.id!==id);
  renderFolders(); renderNotes(); fbSave();
}
function noteChg(id,txt){
  const target=getActiveTarget(); if(!target)return;
  const n=(target.notes||[]).find(n=>n.id===id); if(n)n.text=txt;
  fbSave();
}
function togNote(id){
  colState[id]=!colState[id];
  const el=document.getElementById('ne-'+id); if(!el)return;
  el.classList.toggle('col',colState[id]);
  if(colState[id]){
    const target=getActiveTarget();
    const n=target&&(target.notes||[]).find(n=>n.id===id);
    if(n&&n.text){
      let p=el.querySelector('.prev');
      if(!p){ p=document.createElement('span'); p.className='prev'; el.querySelector('.neh').insertBefore(p,el.querySelector('.chev')); }
      p.textContent=n.text.slice(0,70)+(n.text.length>70?'…':'');
    }
  }
}

/* ── AÇÕES ── */
function addAction(){
  const te=document.getElementById('act-txt'), de=document.getElementById('act-due');
  const txt=te.value.trim(); if(!txt){ te.focus(); return; }
  actionsData.push({id:nxtA++, text:txt, due:de.value||null, created:today(), done:false, doneAt:null});
  te.value=''; de.value=''; te.focus(); renderActions(); fbSave();
}
function togA(id){
  const a=actionsData.find(a=>a.id===id); if(!a)return;
  a.done=!a.done; a.doneAt=a.done?today():null;
  renderActions(); fbSave();
}
function delA(id){
  if(!confirm('Excluir esta ação?'))return;
  actionsData=actionsData.filter(a=>a.id!==id);
  renderActions(); fbSave();
}
function startEditA(id){
  if(editAId===id) return;
  const a=actionsData.find(a=>a.id===id); if(!a||a.done)return;
  editAId=id;
  const wrap=document.getElementById('atxt-'+id); if(!wrap)return;
  wrap.innerHTML=`<div class="aedit-wrap">
    <input class="aedit-in" id="aedit-in-${id}" type="text" value="${esc(a.text)}"
      onkeydown="if(event.key==='Enter')saveEditA(${id});if(event.key==='Escape')cancelEditA(${id})"/>
    <button class="aedit-ok" onclick="saveEditA(${id})">Salvar</button>
    <button class="aedit-cn" onclick="cancelEditA(${id})">Cancelar</button>
  </div>`;
  setTimeout(()=>{ const i=document.getElementById('aedit-in-'+id); if(i){i.focus();i.select();} },30);
}
function saveEditA(id){
  const inp=document.getElementById('aedit-in-'+id); if(!inp)return;
  const txt=inp.value.trim(); if(!txt){ inp.focus(); return; }
  const a=actionsData.find(a=>a.id===id); if(a) a.text=txt;
  editAId=null; renderActions(); fbSave();
}
function cancelEditA(id){ editAId=null; renderActions(); }
function dcls(due,done){ if(done||!due)return''; const t=today(); if(due<t)return'ov'; if(due===t)return'due'; return''; }
function dlbl(due,done){
  if(!due)return''; const c=dcls(due,done);
  return`<span class="mb ${c}">${c==='ov'?'🔴':c==='due'?'🟠':'📅'} ${c==='ov'?'Vencida':'Vence'}: ${fmtD(due)}</span>`;
}
function aiH(a){
  const isEditing=editAId===a.id&&!a.done;
  const txtBlock=isEditing
    ?`<div id="atxt-${a.id}"></div>`
    :`<div class="atxt" id="atxt-${a.id}" ${!a.done?`onclick="startEditA(${a.id})" title="Clique para editar"`:''}>${esc(a.text)}</div>`;
  return`<div class="ai ${a.done?'done':''}">
    <div class="ack" onclick="togA(${a.id})">${a.done?'✓':''}</div>
    <div class="acon">${txtBlock}
      <div class="ameta">
        <span class="mb">🗓 ${fmtD(a.created)}</span>
        ${dlbl(a.due,a.done)}
        ${a.done&&a.doneAt?`<span class="mb dn">✔ ${fmtD(a.doneAt)}</span>`:''}
      </div>
    </div>
    <button class="adel" onclick="delA(${a.id})">✕</button>
  </div>`;
}
function renderActions(){
  const s=[...actionsData].sort((a,b)=>a.id-b.id);
  const p=s.filter(a=>!a.done), d=s.filter(a=>a.done);
  const bar=document.getElementById('sbar');
  if(actionsData.length){
    bar.style.display='flex';
    const ov=p.filter(a=>dcls(a.due,false)==='ov').length;
    bar.innerHTML=`<div class="st">Total: <span>${actionsData.length}</span></div>
      <div class="st">Pendentes: <span>${p.length}</span></div>
      <div class="st">Concluídas: <span>${d.length}</span></div>
      ${ov?`<div class="st" style="color:var(--red)">Vencidas: <span>${ov}</span></div>`:''}`;
  } else bar.style.display='none';
  document.getElementById('ap').innerHTML=p.length
    ?`<div class="alist">${p.map(aiH).join('')}</div>`
    :`<div class="empty"><div class="ei">✅</div><p>Nenhuma ação pendente!<br>Adicione uma acima.</p></div>`;
  const ds=document.getElementById('ads'), de=document.getElementById('ad');
  if(d.length){ ds.style.display='block'; de.innerHTML=`<div class="alist">${d.map(aiH).join('')}</div>`; }
  else ds.style.display='none';
  if(editAId!==null){ const wrap=document.getElementById('atxt-'+editAId); if(wrap)startEditA(editAId); }
}
</script>
</body>
</html>
